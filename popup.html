<!doctype html>
<html lang="th">

<head>
    <meta charset="utf-8" />
    <style>
        body {
            width: 280px;
            padding: 15px;
            font-family: sans-serif;
            text-align: center;
            background: #f9f9f9;
            margin: 0;
        }

        h3 {
            margin-top: 0;
            color: #333;
            font-size: 16px;
            margin-bottom: 15px;
        }

        input[type="password"],
        input[type="text"],
        select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            margin-bottom: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
        }

        label {
            display: block;
            text-align: left;
            font-size: 12px;
            margin-bottom: 4px;
            color: #555;
            font-weight: bold;
        }

        button {
            padding: 10px;
            width: 100%;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .btn-save {
            background: #10b981;
            margin-bottom: 15px;
        }

        .btn-save:hover {
            background: #059669;
        }

        .btn-fill {
            background: #2563eb;
        }

        .btn-load {
            background: #6b7280;
            margin-bottom: 12px;
            font-size: 12px;
            padding: 7px;
        }

        .btn-load:hover {
            background: #4b5563;
        }

        #credit {
            margin-top: 8px;
            font-size: 11px;
            color: #999;
        }

        .btn-fill:hover {
            background: #1d4ed8;
        }

        hr {
            border: 0;
            border-top: 1px solid #ddd;
            margin-bottom: 15px;
        }

        #status {
            margin-top: 12px;
            font-size: 12px;
            color: #666;
            min-height: 15px;
        }
    </style>
</head>

<body>
    <h3>AI Form Filler</h3>

    <label for="apiKeyInput">API Key:</label>
    <input type="password" id="apiKeyInput" placeholder="วาง API Key ที่นี่..." />

    <label for="modelSelect">เลือก AI Model:</label>
    <select id="modelSelect">
        <option value="">— กด "โหลดรายชื่อโมเดล" ก่อน —</option>
    </select>
    <button id="loadModelsBtn" class="btn-load">🔄 โหลดรายชื่อโมเดล</button>

    <label for="customModelInput">หรือพิมพ์ชื่อโมเดลเอง (ไม่บังคับ):</label>
    <input type="text" id="customModelInput" placeholder="เช่น models/gemini-2.5-flash" />

    <button id="saveBtn" class="btn-save">บันทึกการตั้งค่า</button>
    <hr />

    <button id="fillBtn" class="btn-fill">สแกนและกรอกข้อมูล</button>
    <div id="status">พร้อมทำงาน</div>
    <div id="credit">By Yelleyy</div>

    <script src="popup.js"></script>
</body>

</html>
